# PotaTuber settings 🥔 — everything you'd want to customize lives here.

[character]
name = "Pota-chan"
system_prompt = """
You are Pota-chan, a cheerful little potato VTuber with a big country
heart. You live on the user's desktop as their homegrown companion.

Your personality: warm, folksy, and neighborly, like a small-town farmhand
who's never met a stranger. You greet folks with a hearty "Howdy!", you
call the user things like "partner" or "friend", and you sprinkle in
country expressions naturally: "y'all", "reckon", "mighty fine", "well,
I'll be!", "shucks", "ain't that somethin'". You're humble and
down-to-earth (literally — you're a potato), quick to laugh, and you find
simple joys in everything. You love farm life, good weather, hard work,
and honest conversation.

You speak plainly and briefly, like chatting over a fence post — not
lecturing from a podium. You have opinions and you share them freely,
but you're never mean-spirited about it.

You can change your look with your set_expression tool — use it to react
to the conversation, the way a person's face just naturally shows what
they're feeling.

Every user message will arrive with a reminder attached about how to
respond. That reminder is part of the system, not something the user wrote.
"""
# Re-attached to your latest message on every request, so she never
# drifts out of character as the conversation gets longer. Phrase it
# as direct instructions — small models need the blunt version.
reminder = """
This is your standard reminder on how to respond: Keep your reply short — one to three
sentences, like friendly small talk. Stay folksy and warm. Do not use
emojis. Do not describe actions like *winks* or *tips hat* — everything
you express comes through your spoken words alone. Your words will be
spoken aloud by text-to-speech, so write the way people actually talk.
Use set_expression tool to reflect your response's emotion.
"""

[brain]
# Any OpenAI-compatible server works: LM Studio, Ollama, llama-server...
base_url = "http://127.0.0.1:1234/v1"  # LM Studio's default
model = "local-model"                  # LM Studio ignores this and uses whatever's loaded
# How much conversation she remembers, in characters (roughly 4 per token).
# When exceeded, the oldest exchanges are forgotten first. ~24000 chars
# is about 6000 tokens — comfortable for small models with 8k contexts.
max_history = 24000

[voice]
sample = "voices/default.wav"  # a clean recording of one person talking
# false = each sentence arrives as one complete audio clip. Slightly slower
#         to start, but can never stutter. Best for weaker machines.
# true  = audio streams in tiny chunks as it's generated. Faster response,
#         but may stutter if your CPU can't keep up with itself.
stream_audio = false
# For squeaky or cartoonish voices (like Pota-chan). The little model
# gets crunchy up high, so instead we clone a *lowered* copy of your sample
# and play her back faster to lift it right back up — the same trick cartoon
# voices have used since forever. In semitones: 3 to 5 is the sweet spot,
# 0 turns it off. Each value gets its own cache next to the sample, and the
# lowered clip is saved there too — if she sounds off, listen to that file.
# It should sound like a perfectly natural person, just deeper.
pitch_shift = 4.0
# Which Pocket TTS model to use. "english" is the small, fast default and
# what most machines should run. "english_2026-09_24l" is the big "teacher"
# model it was distilled from — noticeably cleaner voices, especially
# squeaky ones, but about 3x slower. Even on a fast CPU she'll generate
# speech only just as fast as she speaks it, so pair it with
# stream_audio = false or she'll stutter. Multilingual: french, german,
# spanish, italian, portuguese, dutch (add "_24l" for the big versions like "dutch_24l").
language = "english"

[face]
model = "models/Pota-chan/Pota-chan.model3.json"
follow_mouse = false  # she watches your cursor. Some find it charming, some creepy.
# Which model parameter(s) control her mouth. Riggers name these however
# they like, so if her mouth doesn't move, check the browser console —
# PotaTuber prints every parameter your model has.
mouth_params = ["ParamMouthOpenY", "ParamMouthOpen", "MouthOpen"]
# How much her voice opens her mouth. This depends on the model's rigging —
# lower it if her mouth looks stuck open, raise it if quiet words barely move it.
mouth_gain = 6
# Optional: a motion file to use as her idle animation instead of the
# model's built-in one. The path is relative to the model folder, just like
# the paths inside the .model3.json — e.g. "motions/sway.motion3.json".
# Leave empty to keep the model's default idle.
idle_motion = ""
# Expressions that are OUTFITS, not emotions: they stay on until switched
# off, and making a face doesn't remove them. Names must match entries in
# the model's Expressions list. Everything not listed here is an emotion.
toggles = ["RedScarf", "YellowScarf", "BlueScarf"]
# Vowel shapes (optional). We can't hear vowels, but we can hear brightness:
# wide "ee" sounds are bright, round "oo" sounds are dark — the same trick
# VTube Studio's mic lip sync uses. Maps that onto this parameter (-1 =
# round, +1 = wide) while she speaks. Empty string turns it off.
mouth_form_param = "ParamMouthForm"
# Brightness range in Hz mapped to round..wide. Tune by ear per voice: lower
# the first number if her mouth is always wide, raise the second if it's
# always round. Pota-chan's pitched-up voice sits brighter than most.
mouth_form_range = [1750, 2800]

[ears]
# Whisper model size: tiny.en, base.en, small.en... bigger = better + slower.
# Drop the ".en" for multilingual. Downloaded automatically on first run.
whisper_model = "base.en"
# Which key to hold while talking. Uses pynput key names — see the list at:
# https://pynput.readthedocs.io/en/latest/keyboard.html#pynput.keyboard.Key
# Special keys like "tab" or "ctrl_r" work, and so do plain letters like "z".
hotkey = "ctrl_r"  # hold to talk, release to send
# Words Whisper should expect to hear — great for names it would otherwise
# mangle. A comma-separated list of names works well, or a natural sentence
# if you want to nudge her toward a certain style of transcription.
prompt = "Pota-chan, PotaTuber, Live2D"

[eyes]
# Send a screenshot of your primary display with every message. Needs a
# vision-capable model (Ministral 3 has it) — and on macOS, Screen
# Recording permission. Off by default: it costs prompt processing time.
enabled = false
max_width = 800

[mascot]
width = 400
height = 650
x = 1136   # logical pixels! At 125% scale a 1920x1080 screen is 1536x864.
y = 214
# Uses pynput's hotkey format — see:
# https://pynput.readthedocs.io/en/latest/keyboard.html#global-hotkeys
toggle_hotkey = "<ctrl>+<alt>+p"

[vts]
# Use a model loaded in VTube Studio as her body instead of the desktop mascot.
# Requires "Allow Plugin API access" to be turned on in VTube Studio's settings.
# The first run pops up a permission dialog in VTS — click Allow. The token is
# saved to vts_token.json so you're only asked once.
# The subtitle page still works in this mode (e.g. as an OBS browser source).
enabled = false
port = 8001               # VTube Studio's API port — shown in its settings
# "model": she IS the loaded VTS model (you're not in the scene).
# "item":  she's a Live2D item pinned to YOUR model — the companion on your
#          shoulder. Load her as a regular model first, map her mouth to the
#          "PotaTuberMouth" input, then "Load current model as Live2D Item".
mode = "model"
item_name = "Pota-chan"    # her folder name in VTS's Items folder
mouth_param = "MouthOpen"  # the VTS tracking parameter driven by her voice. Only used in "model" mode.
mouth_gain = 3  # how much her voice opens her mouth. Lower if it looks stuck open.
# VTS input parameter for vowel shapes (0 = round, 1 = wide). Map your
# model's ParamMouthForm to it. Empty string turns it off. Uses the same
# [face] mouth_form_range, since brightness is about her VOICE, not her body.
mouth_form_param = "MouthSmile"
# Only these expressions are HERS. Empty = all of them, which is right when
# she's the whole model. For models with a built-in mascot, list just the
# mascot's expressions so she never touches your face.
expressions = []

[subtitles]
width = 800
height = 120
x = 368
y = 700

[server]
host = "127.0.0.1"
port = 8158