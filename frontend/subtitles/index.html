<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PotaTuber Subtitles 🥔</title>
  <style>
    body { margin: 0; background: transparent; overflow: hidden; }
    #subtitle {
      position: fixed; bottom: 10px; left: 0; right: 0;
      text-align: center;
      font-family: sans-serif; font-size: 28px; font-weight: bold;
      color: white;
      /* Thick shadow-outline: hides the anti-alias fringe from the
         chroma key AND keeps text readable over anything. */
      text-shadow:
        -2px -2px 0 #000, 2px -2px 0 #000,
        -2px  2px 0 #000, 2px  2px 0 #000,
         0 0 8px #000;
    }
  </style>
</head>
<body>
  <p id="subtitle"></p>
  <script src="subtitles.js"></script>
</body>
</html>
