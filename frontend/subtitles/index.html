<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥔</text></svg>">
  <title>PotaTuber Subtitles 🥔</title>
  <style>
    body { margin: 0; background: transparent; overflow: hidden; }

    /* Tweak these: it's your subtitle style. Keep the stroke and spacing in em
      so they scale with the font. For a custom font, drop a .woff2 next to
      this file and add an @font-face — no web fonts, she works offline. */
    #subtitle {
      position: fixed;
      bottom: 0.15em;      /* room for descenders like y and g */
      left: 0;
      right: 0;
      margin: 0;
      text-align: center;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-size: 44px;
      line-height: 1.3;
      letter-spacing: 0.025em;
      color: white;
      -webkit-text-stroke: 0.08em black;
      paint-order: stroke fill;
      /* A soft glow underneath helps on busy backgrounds. */
      filter: drop-shadow(0 0 0.05em rgba(0, 0, 0, 0.6));
    }
  </style>
</head>
<body>
  <p id="subtitle"></p>
  <script src="subtitles.js"></script>
</body>
</html>
