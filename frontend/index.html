<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥔</text></svg>">
  <title>PotaTuber Console 🥔</title>
  <link rel="stylesheet" href="console.css">
</head>
<body>
  <div id="banner">
  ⚠️ Lost connection to PotaTuber — reconnecting…
  <button id="reconnect">Reconnect now</button>
</div>
  <h3>PotaTuber Console 🥔</h3>
  <div id="toolbar">
    <span id="state"><i></i><b>idle</b></span>
    <label id="eyes" style="display: none">
      <input type="checkbox" id="eyes-toggle"> 👁️ Vision
    </label>
  </div>
  <details id="tools">
    <summary>🖐 No hands yet</summary>
    <ul></ul>
  </details>
  <details id="seen" style="display: none">
    <summary>What she saw</summary>
    <p class="hint">Nothing sent yet. Your next message will include a screenshot.</p>
    <img alt="The screenshot sent with your last message">
  </details>
  <div id="log"></div>
  <form id="chat">
    <input id="text" autocomplete="off" placeholder="Say something to her...">
    <button>Send</button>
  </form>
  <script src="console.js"></script>
</body>
</html>
