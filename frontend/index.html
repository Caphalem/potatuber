<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PotaTuber Console 🥔</title>
  <link rel="stylesheet" href="console.css">
</head>
<body>
  <div id="banner">⚠️ Lost connection to PotaTuber — reconnecting…</div>
  <h3>PotaTuber Console 🥔</h3>
  <div id="toolbar">
    <span id="state"><i></i><b>idle</b></span>
    <label id="eyes" style="display: none">
      <input type="checkbox" id="eyes-toggle"> 👁️ Vision
    </label>
  </div>
  <div id="log"></div>
  <form id="chat">
    <input id="text" autocomplete="off" placeholder="Say something to her...">
    <button>Send</button>
  </form>
  <script src="console.js"></script>
</body>
</html>
